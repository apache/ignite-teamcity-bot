apply plugin: 'java'
apply plugin: 'application'

application {
    mainClass = 'org.apache.ignite.ci.TcHelperJettyLauncher'
    applicationDefaultJvmArgs = igniteJava17JvmArgs + ["-Dteamcity.helper.home=../work",
                                                       "-Dfile.encoding=UTF-8",
                                                       "-Dteamcity.bot.regionsize=16", // 16g Durable Memory region
                                                       "-Dhttp.maxConnections=30",
                                                       "-server",
                                                       "-Xmx16g",
                                                       "-XX:+AlwaysPreTouch",
                                                       "-XX:+UseG1GC",
                                                       "-XX:+ScavengeBeforeFullGC",
                                                       "-XX:+UseStringDeduplication",
                                                       "-Djava.rmi.server.hostname=app02",
                                                       "-Dcom.sun.management.jmxremote",
                                                       "-Dcom.sun.management.jmxremote.port=9010",
                                                       "-Dcom.sun.management.jmxremote.local.only=false",
                                                       "-Dcom.sun.management.jmxremote.authenticate=false",
                                                       "-Dcom.sun.management.jmxremote.ssl=false"]
}

distributions {
    main {
        contents {
            into('war') {
                from project(':ignite-tc-helper-web').tasks.named('war')
            }
        }
    }
}

dependencies {
    implementation (project(":ignite-tc-helper-web"))  {
        transitive = false
    }

    implementation group: 'org.eclipse.jetty', name: 'jetty-util', version: jettyVer
    implementation group: 'org.eclipse.jetty', name: 'jetty-server', version: jettyVer
    implementation group: 'org.eclipse.jetty.ee8', name: 'jetty-ee8-webapp', version: jettyVer

    implementation group: 'com.google.guava', name: 'guava', version: guavaVer

    implementation group: 'org.slf4j', name: 'slf4j-api', version: slf4jVer
    implementation group: 'ch.qos.logback', name: 'logback-core', version: logbackVer
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: logbackVer
}
