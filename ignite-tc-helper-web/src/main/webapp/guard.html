<html>
<head>
    <title>Apache Ignite Teamcity Bot - Tracked Branches selection</title>
    <link rel="icon" href="img/leaf.svg">

    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">

    <link rel="stylesheet" href="css/style-1.5.css">

    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

    <script src="js/common-1.7.js"></script>
    <script>
$(document).ready(function() {
    $.getScript("js/common-1.7.js", function(data, textStatus, jqxhr){ });

    $( document ).tooltip();
    loadData();
});

function loadData() {
    $("#loadStatus").html("&#8987; Please wait");

    loadRunningVisas();

    $.ajax({
        url: "rest/branches/version",
        success: showVersionInfo,
        error: showErrInLoadStatus
    });

    $.ajax({
        url: "rest/branches/getIds",
        success: function(result) {
            $("#loadStatus").html("");
            showTrackedBranchesLinks(result);

            $.ajax({
                url: "rest/tracked/summary",
                success: function(result) {
                    $("#loadStatus").html("");
                    showTrackedBranchesLinks2(result);
                },
                error: showErrInLoadStatus
            });
        },
        error: showErrInLoadStatus
    });



}

function loadRunningVisas() {
    $("#runningVisasStatus").html("Loading running visas...");

    $.ajax({
        url: "rest/visa/running?limit=100",
        success: showRunningVisas,
        error: function(jqXHR, exception) {
            $("#runningVisasStatus").text("Running visas are unavailable.");
            showErrInLoadStatus(jqXHR, exception);
        }
    });
}

function executeCancelRequest(url) {
    $.ajax({
        url: url,
        success: function (result) {
            loadRunningVisas();
        },
        error: showErrInLoadStatus
    });
}

function confirmCancelVisa(url, branchName) {
    var dialog = $("#cancelVisaDialog");

    if (dialog.length > 0)
        dialog.remove();

    dialog = $("<div>", {id: "cancelVisaDialog"});
    dialog.append($("<p>").text("Cancel the running visa observation?"));

    if (isDefinedAndFilled(branchName))
        dialog.append($("<p>", {css: {"font-family": "monospace"}}).text(branchName));

    $("body").append(dialog);

    var buttons = {};

    buttons["Cancel visa"] = function () {
        executeCancelRequest(url);
        $(this).dialog("close");
    };
    buttons["Keep running"] = function () {
        $(this).dialog("close");
    };

    openCenteredDialog(dialog, {
        modal: true,
        resizable: false,
        title: "Confirm visa cancellation",
        width: Math.min(520, $(window).width() - 40),
        buttons: buttons,
        close: function () {
            dialog.remove();
        }
    });
}

function linkOrText(url, text) {
    if (isDefinedAndFilled(url))
        return "<a href='" + escapeHtml(url) + "' target='_blank' rel='noopener noreferrer'>" +
            escapeHtml(text) + "</a>";

    return escapeHtml(text || "");
}

function userHtml(name, url, avatarUrl) {
    if (!isDefinedAndFilled(name))
        return "";

    var img = isDefinedAndFilled(avatarUrl)
        ? "<img src='" + escapeHtml(avatarUrl) + "' loading='lazy' onerror='this.style.display=\"none\"' " +
            "style='width:22px; height:22px; border-radius:50%; object-fit:cover; vertical-align:middle; " +
            "margin-right:6px'>"
        : "";

    return img + linkOrText(url, name);
}

function reportLinkHtml(row) {
    if (!isDefinedAndFilled(row.reportUrl))
        return "";

    return "<a href='" + escapeHtml(row.reportUrl) + "' target='_blank' rel='noopener noreferrer'>Current report</a>";
}

function runningVisaTimeHtml(row) {
    var res = isDefinedAndFilled(row.requestedAgo) ? "requested " + escapeHtml(row.requestedAgo) : "";

    if (isDefinedAndFilled(row.estimatedCompletion))
        res += "<div style='color:#666; font-size:12px'>ETA " + escapeHtml(row.estimatedCompletion) + "</div>";

    return res;
}

function runningVisaBranchHtml(row) {
    var res = escapeHtml(row.branchName || "");
    var report = reportLinkHtml(row);

    if (report !== "")
        res += "<div style='font-size:12px; margin-top:4px'>" + report + "</div>";

    if (isDefinedAndFilled(row.prUrl))
        res += "<div style='font-size:12px; margin-top:4px'>" + linkOrText(row.prUrl, "#" + row.prNum) + "</div>";

    return res;
}

function showRunningVisas(result) {
    var res = "<h3>Running visas</h3>";

    if (!isDefinedAndFilled(result) || result.length === 0) {
        $("#runningVisasStatus").html(res + "<div>No running visas.</div>");

        return;
    }

    res += "<table>";
    res += "<tr><td>Started</td><td>PR author</td><td>Branch / report</td><td>Suite</td>" +
        "<td>Targets</td><td>Progress</td><td></td></tr>";

    for (var i = 0; i < result.length; i++) {
        var row = result[i];

        res += "<tr>";
        res += "<td>" + runningVisaTimeHtml(row) + "</td>";
        res += "<td>" + userHtml(row.prAuthor, row.prAuthorUrl, row.prAuthorAvatarUrl) + "</td>";
        res += "<td>" + runningVisaBranchHtml(row) + "</td>";
        res += "<td>" + escapeHtml(row.buildTypeName || row.buildTypeId || "") + "</td>";
        res += "<td>" + escapeHtml(row.commentTargets || "") + "</td>";
        res += "<td>" + escapeHtml(row.runningProgress || row.status || "") + "</td>";
        res += "<td>";

        if (isDefinedAndFilled(row.cancelUrl))
            res += '<button class="more white short" title="Cancel visa" onclick="' +
                jsCallAttr("confirmCancelVisa", [row.cancelUrl, row.branchName]) + '">&times</button>';

        res += "</td>";
        res += "</tr>";
    }

    res += "</table>";

    $("#runningVisasStatus").html(res);
}

function showTrackedBranchesLinks2(result) {
    var res = "<table >";
    res+="<tr><td>Branch name</td><td>Report</td><td>Merged 10</td><td>Finished last day</td><td>Running</td><td>Queued</td></tr>";
    for (var i = 0; i < result.length; i++) {
        let summary = result[i];
        var id = summary.name;
        res += "<tr>";
        res += "<td align='right'>" + id + ":</td>";
        res += "<td>" + "<a href='current.html?branch=" + id + "'><button>Latest (" + id + ")</button></a>" + "</td>";
        res += "<td>" + " &nbsp;&nbsp;<a href='current.html?branch=" + id + "&count=10'><button title='Failures from last 10 runs merged'>History (" + id + ")</button></a>" + "</td>";

        res += "<td>" +  JSON.stringify(summary.finishedLastDay)+ "</td>";
        res += "<td>" +  JSON.stringify(summary.runningList)+ "</td>";
        res += "<td>" +  JSON.stringify(summary.queuedList)+ "</td>";
        res += "</tr>";
    }

    res += "</table>";


    $("#branchesStatus").html(res);
}

function showTrackedBranchesLinks(result) {
    var res = "<table>";
    res+="<tr><td>Branch name</td><td>Report</td><td>Merged 10</td><td>Finished last day</td><td>Running</td><td>Queued</td></tr>";

    for (var i = 0; i < result.length; i++) {
        var id = result[i];
        res += "<tr>";
        res += "<td align='right'>" + id + ":</td>";
        res += "<td>" + "<a href='current.html?branch=" + id + "'><button>Latest (" + id + ")</button></a>" + "</td>";
        res += "<td>" + " &nbsp;&nbsp;<a href='current.html?branch=" + id + "&count=10'><button title='Failures from last 10 runs merged'>History (" + id + ")</button></a>" + "</td>";
        res += "</tr>";
    }

    res += "</table>";


    $("#branchesStatus").html(res);
}

</script>
</head>
<body>
<div class="formgroup">
    Monitoring. Current Failed Tests: <br>
    <div id="branchesStatus"></div>
</div>
<br>
<div class="formgroup">
    <div id="runningVisasStatus"></div>
</div>
<br>

<div id="loadStatus"></div>
<div id="version"></div>

</body>
</html>
