<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apache Ignite Teamcity Bot - Duration Analytics</title>
    <link rel="icon" href="img/leaf.svg">
    <link rel="stylesheet" href="css/style-1.5.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">

    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="js/common-1.7.js"></script>
    <script src="js/long_running-1.1.js"></script>

    <style>
        body {
            margin: 16px;
        }

        .duration-table {
            border-collapse: collapse;
            margin-bottom: 18px;
            width: 100%;
        }

        .duration-table th,
        .duration-table td {
            border-bottom: 1px solid #ddd;
            padding: 6px 8px;
            text-align: left;
        }

        .duration-table th {
            background: #f2f2f2;
        }

        .duration-note {
            color: #555;
            margin: 4px 0 10px 0;
        }
    </style>
</head>
<body>
<div id="loadStatus"></div>

<div id="durationTabs">
    <ul>
        <li><a href="#suiteDurationsTab">Suites</a></li>
        <li><a href="#testDurationsTab">Tests</a></li>
    </ul>

    <div id="suiteDurationsTab">
        <div class="duration-note">Longest suite duration over recent builds.</div>
        <div id="suiteDurations"></div>
    </div>

    <div id="testDurationsTab">
        <div class="duration-note">Long running tests in tracked master branch suites.</div>
        <div id="testDurations"></div>
    </div>
</div>

<div id="version"></div>

<script>
$(document).ready(function() {
    $("#durationTabs").tabs({
        activate: function(event, ui) {
            window.location.hash = ui.newPanel.attr("id") === "testDurationsTab" ? "tests" : "suites";
        }
    });

    if (window.location.hash === "#tests")
        $("#durationTabs").tabs("option", "active", 1);

    loadData();
    $.ajax({url: "rest/branches/version", success: showVersionInfo, error: showErrInLoadStatus});
});

function loadData() {
    $("#loadStatus").html("&#8987; Please wait");

    loadSuiteDurations();
    loadTestDurations();
}

function loadSuiteDurations() {
    $.ajax({
        url: "/rest/buildtime/analytics",
        success: function(result) {
            showSuiteDurations(result || {});
            $("#loadStatus").html("");
        },
        error: showErrInLoadStatus
    });
}

function loadTestDurations() {
    $.ajax({
        url: "rest/long_running/summary?branch=master",
        success: function(result) {
            $("#testDurations").html(showLongRunningTestsSummary(result));
            $("#loadStatus").html("");
        },
        error: showErrInLoadStatus
    });
}

function showSuiteDurations(result) {
    var res = "";

    res += "<h3>Suites by average duration</h3>";
    res += "<div class='duration-note'>Average duration more than 90 minutes and total duration more than 4 hours.</div>";
    res += suiteDurationTable(result.byBuildType || []);

    res += "<h3>Timed out suites</h3>";
    res += "<div class='duration-note'>Timed out suite average duration more than 60 minutes.</div>";
    res += suiteDurationTable(result.timedOutByBuildType || []);

    $("#suiteDurations").html(res);
}

function suiteDurationTable(rows) {
    var res = "<table class='duration-table'>";

    res += "<tr><th>Suite</th><th>Average duration</th><th>Total duration</th><th>Count</th></tr>";

    for (var i = 0; i < rows.length; i++) {
        var row = rows[i];

        res += "<tr>";
        res += "<td>" + escapeHtml(row.buildType || "") + "</td>";
        res += "<td>" + escapeHtml(row.averageDuration || "") + "</td>";
        res += "<td>" + escapeHtml(row.totalDuration || "") + "</td>";
        res += "<td>" + escapeHtml(row.cnt || "") + "</td>";
        res += "</tr>";
    }

    if (rows.length === 0)
        res += "<tr><td colspan='4'>No duration data.</td></tr>";

    return res + "</table>";
}
</script>
</body>
</html>
