<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apache Ignite Teamcity Bot - Users</title>

    <link rel="icon" href="img/leaf.svg">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.16/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="css/style-1.5.css">

    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://cdn.datatables.net/1.10.16/js/jquery.dataTables.js"></script>
    <script src="https://cdn.datatables.net/1.10.16/js/dataTables.jqueryui.js"></script>
    <script src="js/common-1.7.js"></script>
</head>
<body>
<script>
let currentUsers = [];

$(document).ready(function() {
    $(document).tooltip();

    $.ajax({
        url: "rest/branches/version",
        success: showVersionInfo,
        error: showErrInLoadStatus
    });

    loadAccess();
});

function loadAccess() {
    $.ajax({
        url: "rest/user/currentUserName",
        success: function(menuData) {
            if (menuData.userAdmin === true) {
                $("#claimBlock").hide();
                loadUsers();

                return;
            }

            if (menuData.canClaimUserAdmin === true) {
                $("#claimBlock").show();
                $("#usersBlock").hide();
                $("#loadStatus").html("");

                return;
            }

            $("#usersBlock").hide();
            $("#claimBlock").hide();
            $("#loadStatus").html("Only user admins can view users.");
        },
        error: showErrInLoadStatus
    });
}

function claimUsersPageAdmin() {
    $.ajax({
        method: "POST",
        url: "rest/user/claimUserAdmin",
        success: function() {
            $("#claimBlock").hide();
            loadUsers();
        },
        error: showErrInLoadStatus
    });
}

function loadUsers() {
    $("#loadStatus").html("&#8987; Please wait");

    $.ajax({
        url: "rest/user/list",
        success: function(result) {
            currentUsers = result || [];
            showUsers(result);
            $("#loadStatus").html("");
        },
        error: showErrInLoadStatus
    });
}

function formatTs(ts) {
    if (!isDefinedAndFilled(ts))
        return "";

    return new Date(ts).toLocaleString();
}

function yesNo(val) {
    return val === true ? "yes" : "";
}

function hasGithubMatch(user) {
    return isDefinedAndFilled(user) &&
        (isDefinedAndFilled(user.githubIds) || isDefinedAndFilled(user.autoResolvedGithubIds));
}

function usersWithoutGithubMatch(users) {
    if (!isDefinedAndFilled(users))
        return [];

    return users.filter(function(user) {
        return !hasGithubMatch(user);
    });
}

function refreshUsersGithubSummary(users) {
    let unmatched = usersWithoutGithubMatch(users);

    $("#usersGithubSummary").html("Users without GitHub match: " + unmatched.length);
}

function usersTableRows(users) {
    if (!isDefinedAndFilled(users))
        return [];

    if (!$("#onlyUsersWithoutGithubMatch").prop("checked"))
        return users;

    return usersWithoutGithubMatch(users);
}

function showUsers(result) {
    $("#usersBlock").show();
    refreshUsersGithubSummary(result);

    $("#usersTable").dataTable().fnDestroy();
    $("#usersTable").DataTable({
        data: usersTableRows(result),
        order: [[0, "asc"]],
        iDisplayLength: 50,
        deferRender: true,
        autoWidth: false,
        columns: [
            {
                data: "displayName",
                title: "Name",
                defaultContent: "",
                render: function(data, type, row) {
                    if (type !== "display")
                        return data;

                    var login = row.login || "";
                    var label = data || login;

                    return "<a href='/user.html?login=" + encodeURIComponent(login) + "'>" +
                        escapeHtml(label) + "</a>";
                }
            },
            {
                data: "login",
                title: "Login",
                defaultContent: ""
            },
            {
                data: "lastLoginTs",
                title: "Last login",
                render: function(data) {
                    return formatTs(data);
                }
            },
            {
                data: "userAdmin",
                title: "User admin",
                render: function(data, type, row) {
                    var res = yesNo(data);

                    if (row.configUserAdmin === true)
                        res += " (config)";

                    return res;
                }
            },
            {
                data: "admin",
                title: "TC Ignite Committer",
                render: yesNo
            },
            {
                data: "adminLastCheckedTs",
                title: "Committer checked",
                render: function(data) {
                    return formatTs(data);
                }
            },
            {
                data: "email",
                title: "Email",
                defaultContent: ""
            },
            {
                data: "githubIds",
                title: "GitHub IDs",
                defaultContent: ""
            },
            {
                data: "autoResolvedGithubIds",
                title: "Auto GitHub IDs",
                defaultContent: ""
            },
            {
                data: "credentials",
                title: "Credentials",
                render: function(data, type, row) {
                    var res = isDefinedAndFilled(data) ? data : 0;

                    if (row.staleCredentials > 0)
                        res += " (" + row.staleCredentials + " stale)";

                    return res;
                }
            }
        ]
    });
}
</script>

<div id="form_container">
    <div class="form_description">
        <h2>Users</h2>
        <p>User management</p>
    </div>

    <div id="claimBlock" style="display:none">
        <button type="button" onclick="claimUsersPageAdmin()">Claim user admin</button>
    </div>

    <div id="usersBlock" style="display:none">
        <div style="display:flex; gap:12px; align-items:center; margin-bottom:8px">
            <span id="usersGithubSummary"></span>
            <label title="Show users who have neither configured GitHub IDs nor auto-resolved GitHub IDs">
                <input id="onlyUsersWithoutGithubMatch" type="checkbox" onchange="showUsers(currentUsers)">
                Only without GitHub match
            </label>
        </div>
        <table id="usersTable" class="row-border" style="width:100%">
            <thead>
            <tr class="ui-widget-header">
                <th>Name</th>
                <th>Login</th>
                <th>Last login</th>
                <th>User admin</th>
                <th>TC Ignite Committer</th>
                <th>Committer checked</th>
                <th>Email</th>
                <th>GitHub IDs</th>
                <th>Auto GitHub IDs</th>
                <th>Credentials</th>
            </tr>
            </thead>
        </table>
    </div>
</div>

<div id="loadStatus"></div>
<div id="version"></div>
</body>
</html>
