<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Apache Ignite Teamcity Bot - Visas history</title>
        <link rel="icon" href="img/leaf.svg">
        <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
        <link rel="stylesheet" href="css/style-1.5.css">
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
        <script src="js/common-1.7.js"></script>
        <script src="https://d3js.org/d3.v4.min.js"></script>
        <script src="https://cdn.datatables.net/1.10.16/js/jquery.dataTables.js"></script>
        <script src="https://cdn.datatables.net/1.10.16/js/dataTables.jqueryui.js"></script>
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
        <link rel="stylesheet" href="https://cdn.datatables.net/1.10.16/css/jquery.dataTables.min.css">
    </head>
<body>
    <br>
    <div id="loadStatus"></div>
    <br>
    <div style="margin:0 0 10px 0">
        Show latest
        <select id="historyLimit">
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="1000">1000</option>
            <option value="0">all</option>
        </select>
        visa requests
        <button type="button" onclick="loadData()">Refresh</button>
    </div>
    <table id="visasTable" class="row-border" style="width:100%">
        <thead>
            <tr class="ui-widget-header ">
                <th>Status</th>
                <th>Date</th>
                <th>Requested by</th>
                <th>PR author</th>
                <th>Branch</th>
                <th>Ticket / PR</th>
                <th>Options</th>
                <th>Slice</th>
                <th>Suite</th>
                <th>Blockers</th>
            </tr>
        </thead>
    </table>
    <br>
    <div id="version"></div>
<script>
function showErrInLoadStatus(jqXHR, exception) {
    if (jqXHR.status === 0) {
        $("#loadStatus").html('Not connect.\n Verify Network.');
    } else if (jqXHR.status === 404) {
        $("#loadStatus").html('Requested page not found. [404]');
    } else if (jqXHR.status === 401) {
        $("#loadStatus").html('Unauthorized [401]');

        setTimeout(function() {
            window.location.href = "/login.html" + "?backref=" + encodeURIComponent(window.location.href);
        }, 1000);
    } else if (jqXHR.status === 403) {
        $("#loadStatus").html('Forbidden [403]');
    } else if( jqXHR.status === 418) {
        $("#loadStatus").html('Services are starting [418], I\'m a teapot');
    } else if (jqXHR.status === 424) {
        $("#loadStatus").html('Dependency problem: [424]: ' + jqXHR.responseText);
    } else if (jqXHR.status === 500) {
        $("#loadStatus").html('Internal Server Error [500].');
    } else if (exception === 'parsererror') {
        $("#loadStatus").html('Requested JSON parse failed.');
    } else if (exception === 'timeout') {
        $("#loadStatus").html('Time out error.');
    } else if (exception === 'abort') {
        $("#loadStatus").html('Ajax request aborted.');
    } else {
        $("#loadStatus").html('Uncaught Error.\n' + jqXHR.responseText);
    }
}

$(document).ready(function() {
    loadData();

    $.ajax({ url: "rest/branches/version",  success: showVersionInfo, error: showErrInLoadStatus });
});

function sendCancelRequest(url) {
    $.ajax({
        url: url,
        success: function (result) {
            location.reload();
        },
        error: showErrInLoadStatus
    });
}

function linkOrText(url, text) {
    if (isDefinedAndFilled(url))
        return "<a href='" + escapeHtml(url) + "' target='_blank' rel='noopener noreferrer'>" +
            escapeHtml(text) + "</a>";

    return escapeHtml(text || "");
}

function userHtml(name, url, avatarUrl) {
    if (!isDefinedAndFilled(name))
        return "";

    var img = isDefinedAndFilled(avatarUrl)
        ? "<img src='" + escapeHtml(avatarUrl) + "' loading='lazy' onerror='this.style.display=\"none\"' " +
            "style='width:22px; height:22px; border-radius:50%; object-fit:cover; vertical-align:middle; " +
            "margin-right:6px'>"
        : "";

    return img + linkOrText(url, name);
}

function prAuthorHtml(row) {
    return userHtml(row.prAuthor, row.prAuthorUrl, row.prAuthorAvatarUrl);
}

function ticketPrHtml(row) {
    var res = [];

    if (isDefinedAndFilled(row.ticket))
        res.push(linkOrText(row.ticketUrl, row.ticket));

    if (isDefinedAndFilled(row.prNum))
        res.push(linkOrText(row.prUrl, "#" + row.prNum));

    return res.join("<br>");
}

function optionsHtml(row) {
    var targets = isDefinedAndFilled(row.commentTargets) ? row.commentTargets : "(not stored)";
    var policy = row.commentOnlyIfNoBlockers ? "only clean run (no blockers)" : "always";
    var rerun = row.rerun ? "rerun / observed run" : "direct comment";

    return "<div><b>Targets:</b> " + escapeHtml(targets) + "</div>" +
        "<div><b>Policy:</b> " + escapeHtml(policy) + "</div>" +
        "<div><b>Mode:</b> " + escapeHtml(rerun) + "</div>";
}

function sliceHtml(row) {
    var res = escapeHtml(row.analysisSlice || "");

    if (isDefinedAndFilled(row.buildIds))
        res += "<div style='color:#666; font-size:12px'>rerun/observed build ids: " +
            escapeHtml(row.buildIds) + "</div>";

    return res;
}

function showVisasTable(result) {
    let visasTable = $('#visasTable');

    visasTable.dataTable().fnDestroy();

    var table = visasTable.DataTable({
        "order": [[ 1, 'desc' ]],
        data: result,
        "iDisplayLength": 30, //rows to be shown by default
        stateSave: false,
        deferRender: true,
        processing: true,
        autoWidth: false,
        columnDefs: [
            {
                targets: '_all',
                className: 'dt-body-center'
            },
        ],
        columns: [
            {
                "data": "status",
                title: "Status",
                "render": function (data, type, row, meta) {
                    let res = '';

                    if (type !== 'display')
                        return data;

                    if (type === 'display') {
                        res += "<table width='100%'><tr><td width='70%' style='vertical-align: middle'>";

                        if (data === 'finished' && row.commentUrl)
                            res += "<a href='" + row.commentUrl + "'>" + data + "</a>";
                        else
                            res += escapeHtml(data);

                        if (isDefinedAndFilled(row.commentStatus))
                            res += "<div style='color:#666; font-size:12px'>" +
                                escapeHtml(row.commentStatus) + "</div>";

                        res += "</td><td width=\"30%\">";

                        if (row.cancelUrl != null)
                            res += '<button class="more white short" onclick="sendCancelRequest(\'' + row.cancelUrl + '\')">&times</button>';

                        res += "</td></tr>";
                    }

                    return res;
                }
            },
            {
                "data": "date",
                title: "Date"
            },
            {
                "data": "userName",
                title: "Requested by",
                defaultContent: "",
                "render": function (data, type, row, meta) {
                    return type === 'display' ? userHtml(row.userName, row.userUrl, row.userAvatarUrl) : data;
                }
            },
            {
                "data": "prAuthor",
                title: "PR author",
                defaultContent: "",
                "render": function (data, type, row, meta) {
                    return type === 'display' ? prAuthorHtml(row) : data;
                }
            },
            {
                "data": "branchName",
                title: "Branch"
            },
            {
                "data": "ticket",
                title: "Ticket / PR",
                defaultContent: "",
                "render": function (data, type, row, meta) {
                    return type === 'display' ? ticketPrHtml(row) : (data || "") + " #" + (row.prNum || "");
                }
            },
            {
                "data": "commentTargets",
                title: "Options",
                defaultContent: "",
                "render": function (data, type, row, meta) {
                    return type === 'display' ? optionsHtml(row) : data;
                }
            },
            {
                "data": "analysisSlice",
                title: "Slice",
                defaultContent: "",
                "render": function (data, type, row, meta) {
                    return type === 'display' ? sliceHtml(row) : data;
                }
            },
            {
                "data": "buildTypeName",
                title: "Suite",
                "render": function (data, type, row, meta) {
                    if (isDefinedAndFilled(row.buildTypeName))
                        return row.buildTypeName;
                    else
                        return row.buildTypeId;
                }
            },
            {
                "data": "blockers",
                title: "Blockers",
                "render": function (data, type, row, meta) {
                    if (type === 'display') {
                        if (row.status != 'finished')
                            data = "";
                    }

                    return data;
                }
            }
        ]
    });
}

function loadData() {
    var limit = $("#historyLimit").val() || "50";

    $("#loadStatus").html("Loading latest " + (limit === "0" ? "all" : limit) + " visa requests...");

    $.ajax({
            url: "rest/visa/history?limit=" + encodeURIComponent(limit),
            success: function (result) {
                showVisasTable(result);
                $("#loadStatus").html("");
            },
            error: showErrInLoadStatus
        }
    );
}
</script>
</body>
</html>
