<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apache Ignite Teamcity Bot - Server monitoring page</title>

    <link rel="icon" href="img/leaf.svg">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="css/style-1.5.css">

    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

    <script src="js/common-1.7.js"></script>
    <script src="js/testfails-2.3.js"></script>
</head>
<body>
<script>
    var monitoringAdmin = false;

    $(document).ready(function() {
        $.getScript("js/common-1.7.js", function(data, textStatus, jqxhr){ });

        $( document ).tooltip();

        $.ajax({
            url: "/rest/user/currentUserName",
            success: function(result) {
                monitoringAdmin = result.admin === true;

                initAdminControls();
                renderUserAdminLink(result, "#userAdminBlock");
                loadData();
                setInterval(loadAiPromptsData, 5000);
            },
            error: function() {
                monitoringAdmin = false;

                initAdminControls();
                $("#userAdminBlock").hide();
                loadData();
                setInterval(loadAiPromptsData, 5000);
            }
        });
    });

    function initAdminControls() {
        if (monitoringAdmin)
            $(".adminOnly").show();
        else
            $(".adminOnly").hide();
    }

    function loadPofilingData() {
        $.ajax({
            url: "rest/monitoring/profiling",
            success: function (result) {
                $("#loadStatus").html("");

                showProfiling(result);
            },
            error: showErrInLoadStatus
        });
    }

    function loadRequestData() {
        $.ajax({
            url: "rest/monitoring/requests",
            success: function (result) {
                $("#loadStatus").html("");

                showRequests(result);
            },
            error: showErrInLoadStatus
        });
    }

    function loadData() {
        $("#loadStatus").html("&#8987; Please wait");
        $.ajax({
            url: "rest/branches/version",
            success: showVersionInfo,
            error: showErrInLoadStatus
        });

        if (monitoringAdmin) {
            $.ajax({
                url: "rest/monitoring/tasks",
                success: function(result) {
                    $("#loadStatus").html("");

                    showTasks(result);
                },
                error: showErrInLoadStatus
            });

            $.ajax({
                url: "rest/monitoring/appLogSummaryLink",
                success: showAppLogSummaryLink,
                error: showErrInLoadStatus
            });
        }

        loadPofilingData();
        loadRequestData();

        $.ajax({
            url: "rest/monitoring/cacheMetrics",
            success: function(result) {
                $("#loadStatus").html("");

                showCacheMetrics(result);
            },
            error: showErrInLoadStatus
        });

        loadAiPromptsData();
    }

    function loadAiPromptsData() {
        $.ajax({
            url: "rest/monitoring/aiPrompts",
            success: function(result) {
                $("#loadStatus").html("");

                showAiPrompts(result);
            },
            error: showErrInLoadStatus
        });
    }

    /**
     * @param result org.apache.ignite.ci.web.rest.monitoring.TaskResult
     */
    function showTasks(result) {
        var res = "<table class='stat'>" ;
        res += "<tr>";
        res += "<th>Name</th>";
        res += "<th>Start</th>";
        res += "<th>Count</th>";
        res += "<th>End</th>";
        res += "<th>Result</th>";
        if (monitoringAdmin)
            res += "<th>Actions</th>";
        res += "</tr>";
        for (var i = 0; i < result.length; i++) {
            var task = result[i];
            var logUrl = "monitoring-log.html?startTs=" + encodeURIComponent(task.startTs)
                + "&endTs=" + encodeURIComponent(task.endTs || 0)
                + "&name=" + encodeURIComponent(task.name);

            res += "<tr>";
            res += "<td>" + escapeHtml(task.name) + "</td>";
            res += "<td>" + escapeHtml(task.start) + "</td>";
            res += "<td>" + escapeHtml(task.count) + "</td>";
            res += "<td>" + escapeHtml(task.end) + "</td>";
            res += "<td>" + escapeHtml(task.result) + "</td>";
            if (monitoringAdmin)
                res += "<td><a target='_blank' href='" + logUrl + "'>Warnings/errors</a></td>";
            res += "</tr>";
        }
        res += "</table>";
        $("#tasks").html(res);
    }

    function showAppLogSummaryLink(result) {
        var logUrl = "monitoring-log.html?startTs=" + encodeURIComponent(result.startTs)
            + "&endTs=0"
            + "&name=" + encodeURIComponent(result.name);

        $("#appLogSummary").html("<a target='_blank' href='" + logUrl + "'>Application warnings/errors since start</a>");
    }

    /**
     * @param result org.apache.ignite.ci.web.rest.monitoring.HotSpot
     */
    function showProfiling(result) {
        var res = "<table class='stat'>" ;
        res += "<tr>";
        res += "<th>Name</th>";
        res += "<th>Duration</th>";
        res += "<th>Count</th>";
        res += "<th>Avg.Duration</th>";
        res += "</tr>";
        for (var i = 0; i < result.length; i++) {
            var inv = result[i];
            res += "<tr>";
            res += "<td>" + escapeHtml(inv.method) + "</td>";
            res += "<td>" + escapeHtml(inv.duration) + "</td>";
            res += "<td>" + escapeHtml(inv.count) + "</td>";
            res += "<td>" + escapeHtml(inv.avgDuration) + "</td>";
            res += "</tr>";
        }
        res += "</table>";
        $("#profiling").html(res);
    }

    /**
     * @param result org.apache.ignite.ci.web.rest.monitoring.RequestStat
     */
    function showRequests(result) {
        var res = "<table class='stat'>" ;
        res += "<tr>";
        res += "<th>Method</th>";
        res += "<th>Path</th>";
        res += "<th>Count</th>";
        res += "<th>Total, ms</th>";
        res += "<th>Avg, ms</th>";
        res += "<th>Max, ms</th>";
        res += "<th>Last, ms</th>";
        res += "<th>Last status</th>";
        res += "<th>Last request</th>";
        res += "</tr>";
        for (var i = 0; i < result.length; i++) {
            var inv = result[i];
            res += "<tr>";
            res += "<td>" + escapeHtml(inv.method) + "</td>";
            res += "<td>" + escapeHtml(inv.path) + "</td>";
            res += "<td>" + escapeHtml(inv.count) + "</td>";
            res += "<td>" + escapeHtml(inv.totalMs) + "</td>";
            res += "<td>" + escapeHtml(inv.avgMs) + "</td>";
            res += "<td>" + escapeHtml(inv.maxMs) + "</td>";
            res += "<td>" + escapeHtml(inv.lastMs) + "</td>";
            res += "<td>" + escapeHtml(inv.lastStatus) + "</td>";
            res += "<td>" + escapeHtml(inv.lastRequest) + "</td>";
            res += "</tr>";
        }
        res += "</table>";
        $("#requests").html(res);
    }

    function showCacheMetrics(result) {
        var res = "<table class='stat'>" ;
        res += "<tr>";
        res += "<th>Name</th>";
        res += "<th>Size</th>";
        res += "<th>Parts</th>";
        res += "</tr>";
        for (var i = 0; i < result.length; i++) {
            var inv = result[i];
            res += "<tr>";
            res += "<td>" + escapeHtml(inv.name) + "</td>";
            res += "<td>" + escapeHtml(inv.size) + "</td>";
            res += "<td>" + escapeHtml(inv.parts) + "</td>";
            res += "</tr>";
        }
        $("#caches").html(res);
    }

    function showAiPrompts(result) {
        var res = "<table class='stat'>" ;
        res += "<tr>";
        res += "<th>Id</th>";
        res += "<th>Kind</th>";
        res += "<th>Branch</th>";
        res += "<th>Server</th>";
        res += "<th>Suite</th>";
        res += "<th>Test</th>";
        res += "<th>Stage</th>";
        res += "<th>Start</th>";
        res += "<th>End</th>";
        res += "<th>Duration</th>";
        res += "<th>Running</th>";
        res += "<th>Result</th>";
        res += "</tr>";
        for (var i = 0; i < result.length; i++) {
            var req = result[i];
            res += "<tr>";
            res += "<td>" + escapeHtml(req.id) + "</td>";
            res += "<td>" + escapeHtml(req.kind) + "</td>";
            res += "<td>" + escapeHtml(req.branch) + "</td>";
            res += "<td>" + escapeHtml(req.server) + "</td>";
            res += "<td>" + escapeHtml(req.suite) + "</td>";
            res += "<td>" + escapeHtml(req.test) + "</td>";
            res += "<td>" + escapeHtml(req.stage) + "</td>";
            res += "<td>" + escapeHtml(req.start) + "</td>";
            res += "<td>" + escapeHtml(req.end) + "</td>";
            res += "<td>" + escapeHtml(req.duration) + "</td>";
            res += "<td>" + escapeHtml(req.running) + "</td>";
            res += "<td>" + escapeHtml(req.result) + "</td>";
            res += "</tr>";
        }
        res += "</table>";
        $("#aiPrompts").html(res);
    }

    function resetProfiling() {
        $.ajax({
            url: "rest/monitoring/resetProfiling",
            method: "post",
            success: function(result) {
                loadPofilingData();
            },
            error: showErrInLoadStatus
        });
    }

    function resetRequests() {
        $.ajax({
            url: "rest/monitoring/resetRequests",
            method: "post",
            success: function(result) {
                loadRequestData();
            },
            error: showErrInLoadStatus
        });
    }

    function testSlackNotification() {
        if (!monitoringAdmin)
            return false;

        $.ajax({
            url: "rest/monitoring/testSlackNotification",
            method: "post",
            success: function(result) {
                alert(JSON.stringify(result));
            },
            error: function(result) {
                alert(JSON.stringify(result));
            }
        });

        return false;
    }

    function testEmailNotification() {
        if (!monitoringAdmin)
            return false;

        $.ajax({
            url: "rest/monitoring/testEmailNotification",
            method: "post",
            data: $("#emailForm").serialize(),
            success: function(result) {
                alert(JSON.stringify(result));
            },
            error: function(result) {
                alert(JSON.stringify(result));
            }
        });

        return false;
    }

    function escapeHtml(str) {
        return String(str == null ? "" : str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

</script>

<div class="adminOnly">
    Tasks Monitoring Data:
    <div id="appLogSummary" style="font-family: monospace"></div>
    <div id="tasks" style="font-family: monospace"></div>
    <br>
</div>

<div id="userAdminBlock" style="display: none">
    <hr>
    <b>Users:</b>
    <br>
</div>

<hr>
<b>AI Prompt Requests:</b>
<div id="aiPrompts" style="font-family: monospace"></div>
<br>

<hr>
<b>REST Request Timings:</b> <button class="adminOnly" onclick="resetRequests()">Reset</button>
<div id="requests" style="font-family: monospace"></div>
<br>

<hr>
<b>Method Profiling Data:</b> <button class="adminOnly" onclick="resetProfiling()">Reset</button>
<div id="profiling" style="font-family: monospace"></div>
<br>

<hr>
<b>Ignite Caches Data:</b>
<div id="caches" style="font-family: monospace"></div>

<br>

<hr>
<div class="adminOnly">
<b>Test Slack notification:</b> <button onclick="testSlackNotification()">Send</button>
<b>Test Email notification:</b>

<form id="emailForm"><b>Email Address:</b>
    <input type="text" placeholder="Enter Address" name="address" required>
</form>

<button onclick="testEmailNotification()">Send</button>
</div>

<br>

<div id="loadStatus"></div>
<div id="version"></div>

</body>
</html>
