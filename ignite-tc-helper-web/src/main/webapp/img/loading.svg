<?xml version="1.0" encoding="UTF-8"?>
<!--
  Loading spinner replacement.
  Source/provenance: project-local SVG replacement after Wikimedia Commons
  "Loading spinner.svg" review.
  Reference: https://commons.wikimedia.org/wiki/File:Loading_spinner.svg
  Reference license: Creative Commons CC0 1.0 Universal Public Domain Dedication
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Loading">
  <g transform="translate(32 32)">
    <g>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="1.00"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.92" transform="rotate(30)"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.84" transform="rotate(60)"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.76" transform="rotate(90)"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.68" transform="rotate(120)"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.60" transform="rotate(150)"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.52" transform="rotate(180)"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.44" transform="rotate(210)"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.36" transform="rotate(240)"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.28" transform="rotate(270)"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.20" transform="rotate(300)"/>
      <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#555" opacity="0.12" transform="rotate(330)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
