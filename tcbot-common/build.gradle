apply plugin: 'java'

dependencies {
    api "com.google.guava:guava:$guavaVer"

    api "org.slf4j:slf4j-api:$slf4jVer"
    api "com.google.code.findbugs:jsr305:$jsr305Ver"
    api "org.checkerframework:checker-qual:$checkerQualVer"

    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    
    testImplementation "junit:junit:$junitVer";
    testImplementation "org.mockito:mockito-core:$mockitoVer";
}
