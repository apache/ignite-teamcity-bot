plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.apache.ignite:ignite-core:$ignVer"
    implementation "ch.qos.logback:logback-classic:$logbackVer"
    implementation project(':tcbot-common')

    testImplementation project(':ignite-tc-helper-web')
    testImplementation project(':tcbot-persistence')
    testImplementation project(':tcbot-teamcity-ignited')
    testImplementation "org.apache.ignite:ignite-slf4j:$ignVer"
    testImplementation "junit:junit:$junitVer"
    testImplementation "org.mockito:mockito-core:$mockitoVer"
}

application {
    mainClass = 'org.apache.ignite.migrate.GridIntListMigrator'
}

test {
    jvmArgs igniteJava17JvmArgs
    maxHeapSize = '1536m'
    systemProperty 'compat.work.dir', file('src/test/work/ignite-db-compat').absolutePath
    exclude '**/LegacyPersistentStorageCompatibilityTest.class'
    exclude '**/GridIntListMigratorIntegrationTest.class'
    failOnNoDiscoveredTests = false

    testLogging {
        events 'passed', 'failed', 'skipped', 'standardOut', 'standardError'
        showStandardStreams = true
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs heavyweight migrator integration tests against real Ignite persistence.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    jvmArgs igniteJava17JvmArgs
    maxHeapSize = '1536m'
    systemProperty 'compat.work.dir', file('src/test/work/ignite-db-compat').absolutePath
    include '**/LegacyPersistentStorageCompatibilityTest.class'
    include '**/GridIntListMigratorIntegrationTest.class'

    testLogging {
        events 'passed', 'failed', 'skipped', 'standardOut', 'standardError'
        showStandardStreams = true
    }
}
