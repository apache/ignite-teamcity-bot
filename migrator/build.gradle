plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.apache.ignite:ignite-core:$ignVer"
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: logbackVer
    implementation project(':tcbot-common')

    testImplementation project(':ignite-tc-helper-web')
    testImplementation project(':tcbot-persistence')
    testImplementation project(':tcbot-teamcity-ignited')
    testImplementation "org.apache.ignite:ignite-slf4j:$ignVer"
    testImplementation group: 'junit', name: 'junit', version: junitVer
}

application {
    mainClass = 'org.apache.ignite.migrate.GridIntListMigrator'
}

test {
    jvmArgs igniteJava17JvmArgs
    maxHeapSize = '1536m'
    systemProperty 'compat.work.dir', file('src/test/work/ignite-db-compat').absolutePath
    exclude '**/LegacyPersistentStorageCompatibilityTest.class'
    failOnNoDiscoveredTests = false

    testLogging {
        events 'passed', 'failed', 'skipped', 'standardOut', 'standardError'
        showStandardStreams = true
    }
}

tasks.register('legacyDbCompatPerfTest', Test) {
    description = 'Runs the heavyweight legacy Ignite persistent storage compatibility/perf test.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    jvmArgs igniteJava17JvmArgs
    maxHeapSize = '1536m'
    systemProperty 'compat.work.dir', file('src/test/work/ignite-db-compat').absolutePath
    include '**/LegacyPersistentStorageCompatibilityTest.class'

    testLogging {
        events 'passed', 'failed', 'skipped', 'standardOut', 'standardError'
        showStandardStreams = true
    }
}
